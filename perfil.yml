# Tu semblanza. Separa los párrafos con una línea en blanco.
# Usa *asteriscos* para poner títulos de obras en cursivas.
bio: |
  Doctor en Investigación de la Comunicación por la Universidad Anáhuac México y doctor en Ciencias de la Información por la Université Savoie Mont-Blanc, en Francia. Es profesor investigador del Centro de Investigación para la Comunicación Aplicada (CICA) de la Facultad de Comunicación de la Universidad Anáhuac México.

  Buena parte de su trabajo estudia la publicidad de los alimentos ultraprocesados: cómo se anuncian en redes sociales, cómo han cambiado la dieta tradicional de México frente a la de España y Estados Unidos, y qué hacen las ONG de Brasil, Colombia, Estados Unidos y México ante la publicidad engañosa. Para observarlo usa métodos visuales, como la cámara colaborativa y el eye tracking, en estudios que comparan a Francia con México.

  También investiga el patrimonio monumental mexicano con inteligencia artificial y entornos inmersivos de realidad virtual, la representación visual de la otredad en el discurso presidencial, las tácticas cotidianas de protesta y la adaptación literaria en el cine mexicano de 1939 a 1955. Publica columnas de análisis en *Latinoamérica21*.

